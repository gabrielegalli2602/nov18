<!DOCTYPE html>
<html>

<head>

	<meta charset="UTF-8">
	<title>Registro scolastico</title>
	
	<style>
	
		table {
		
			width: 900px;
		
			text-align: center;
		
			margin-left: auto;
			margin-right: auto;
		
			font-family: Courier;
			font-size: 20px;
			background-color: gray;
			border: 2px solid #3c4142;
			
			border-collapse: separate; 
			border-spacing: 0; 
			border-radius: 10px;
			overflow: hidden;
		
		}
		
		th {
		
			background-color: #34baeb;
			color: white;
			
			border-bottom: 2px solid #004159;
			border-right: 2px solid #004159;
			border-top: 2px solid #86ddfc;
			border-left: 2px solid #86ddfc;
			
			margin: 10px;
			padding: 10px;
		
		}
		
		td {
			
			background-color: gray;
			color: white;
			
			font-weight: 400;
		
			border-bottom: 2px solid black;
			border-right: 2px solid black;
			border-top: 2px solid lightgray;
			border-left: 2px solid lightgray;
			margin: 10px;
			padding: 10px;
		
		}
	
	</style>
	
</head>

<body>

	<table>
		<script>
		
			let voto;
			let giudizio;
			
			document.write("<th>"+"Nome"+"</th>");
			document.write("<th>"+"Voto"+"</th>");
			
			let nome = prompt("Nome dello studente (scrivere fine per uscire dal inserimento): ");
			
			while (nome !== "fine") { 
				
				voto = Number(prompt("Voto dello studente (inserire numeri da 1 a 10): "));
				
				switch (voto) {
				
				case 1:
				case 2:
				case 3:
				case 4:
				case 5:
					giudizio = "Insufficiente";
					break;
					
				case 6:
					giudizio = "Sufficiente";
					break;
					
				case 7:
					giudizio = "Discreto";
					break;
				
				case 8:
					giudizio = "Buono";
					break;
					
				case 9:
					giudizio = "Ottimo";
					break;
					
				case 10:
					giudizio = "Eccellente";
					break;
					
				default:
					giudizio = "sbagliato";
					break;
					
			}
					
				document.write("<tr>");
				
				document.write("<td>"+nome+"</td>");
				document.write("<td>"+giudizio+"</td>");
					
				document.write("</tr>");
					
				nome = prompt("Nome dello studente (scrivere fine per uscire dal inserimento): ");
					
			}
		
		</script>
	</table>

</body>

</html>
